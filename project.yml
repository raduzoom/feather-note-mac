name: FeatherNote
options:
  bundleIdPrefix: app.feathernote
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  FeatherCore:
    path: Packages/FeatherCore
  FeatherCrypto:
    path: Packages/FeatherCrypto
  FeatherSync:
    path: Packages/FeatherSync
  FeatherEditor:
    path: Packages/FeatherEditor
  FeatherImport:
    path: Packages/FeatherImport
targets:
  FeatherNote:
    type: application
    platform: macOS
    sources: [FeatherNote]
    settings:
      base:
        PRODUCT_NAME: Feather Note
        PRODUCT_MODULE_NAME: FeatherNote
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: app.feathernote.FeatherNote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feather Note
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - package: FeatherCore
      - package: FeatherCrypto
      - package: FeatherSync
      - package: FeatherEditor
      - package: FeatherImport
  FeatherNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FeatherNoteTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Feather Note.app/Contents/MacOS/Feather Note"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FeatherNote
  FeatherNoteUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FeatherNote
schemes:
  FeatherNote:
    build:
      targets:
        FeatherNote: all
    test:
      targets:
        - FeatherNoteTests
        - FeatherNoteUITests
        - package: FeatherCore/FeatherCoreTests
        - package: FeatherCrypto/FeatherCryptoTests
        - package: FeatherSync/FeatherSyncTests
        - package: FeatherEditor/FeatherEditorTests
        - package: FeatherImport/FeatherImportTests
