name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild test -project FeatherNote.xcodeproj -scheme FeatherNote -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
